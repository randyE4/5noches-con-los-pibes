const TEXTO_FINAL = "ESCRIBE AQUÍ TU TEXTO FINAL";

const cv = document.getElementById("c"), ctx = cv.getContext("2d"), W = 400, H = 260;
const mc = document.getElementById("mapa"), mctx = mc.getContext("2d");
const $ = id => document.getElementById(id);
const NOMBRES = ["Sala principal", "Comedor", "Cocina", "Pasillo central", "Puerta izquierda", "Puerta derecha"];
const CORTOS = ["Sala", "Comedor", "Cocina", "Pasillo", "P. Izq", "P. Der"];
const NUM_CAMS = 6;
const HORAS = ["12 AM", "1 AM", "2 AM", "3 AM", "4 AM", "5 AM", "6 AM"];
const COL = ["#c55", "#5a5", "#58c", "#c8c"];
const SUELO = 216;

let P = [];
let T1;
const S = { noche: 1, t: 0, hora: 0, energia: 100,
  puerta: { L: false, R: false }, luz: { L: false, R: false },
  cam: false, camN: 0, fin: null };

function crearPersonajes() {
  P = CFG.personajes.map(p => {
    const im = new Image();
    if (p.img) im.src = p.img;
    return { ...p, im, pos: 0, lado: null, espera: 0 };
  });
}

function factorNoche() { return 1 + (S.noche - 1) * 0.3; }

function posicion(e, el, w, h) {
  const r = el.getBoundingClientRect();
  return [(e.clientX - r.left) * w / r.width, (e.clientY - r.top) * h / r.height];
}

function dibujaPersonaje(p, k, x, y, s) {
  if (p.im.complete && p.im.naturalWidth) {
    const w = s * (p.im.naturalWidth / p.im.naturalHeight);
    ctx.drawImage(p.im, x - w / 2, y - s, w, s);
  } else {
    ctx.fillStyle = COL[k % 4];
    ctx.beginPath();
    ctx.arc(x, y - s / 2, s / 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#000";
    ctx.font = "bold 14px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(p.nombre.slice(-1), x, y - s / 2 + 5);
  }
}

// ----- CUARTOS DE CÁMARA -----
function fondoCuarto(i) {
  if (i === 0) { // Sala
    ctx.fillStyle = "#3b2f4f"; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#2b2b2b"; ctx.fillRect(0, 210, W, 50);
    ctx.fillStyle = "#111"; ctx.fillRect(250, 50, 110, 70);
    ctx.fillStyle = "#4a7"; ctx.fillRect(256, 56, 98, 58);
    ctx.fillStyle = "#5a2d2d"; ctx.fillRect(40, 170, 150, 40); ctx.fillRect(40, 150, 150, 22);
    ctx.fillStyle = "#777"; ctx.fillRect(340, 90, 6, 120);
    ctx.fillStyle = "#ffd"; ctx.beginPath(); ctx.arc(343, 80, 14, 0, Math.PI * 2); ctx.fill();
  } else if (i === 1) { // Comedor
    ctx.fillStyle = "#4a3a2a"; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#3a2716"; ctx.fillRect(0, 210, W, 50);
    ctx.fillStyle = "#634"; ctx.fillRect(160, 40, 80, 50);
    ctx.fillStyle = "#6b4a2b"; ctx.fillRect(110, 170, 180, 14);
    ctx.fillRect(122, 184, 8, 30); ctx.fillRect(270, 184, 8, 30);
    ctx.fillStyle = "#5a3d22"; ctx.fillRect(90, 140, 22, 30); ctx.fillRect(288, 140, 22, 30);
  } else if (i === 2) { // Cocina
    ctx.fillStyle = "#cfcfc4"; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#7d7d7d"; ctx.fillRect(0, 210, W, 50);
    ctx.fillStyle = "#8a6e4e"; ctx.fillRect(20, 50, 140, 50);
    ctx.fillStyle = "#aaa"; ctx.fillRect(0, 130, 310, 18);
    ctx.fillStyle = "#222";
    ctx.beginPath(); ctx.arc(100, 139, 5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(140, 139, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ddd"; ctx.fillRect(320, 80, 60, 130);
  } else { // Pasillo central
    ctx.fillStyle = "#1e1e26"; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#2c2c30"; ctx.fillRect(0, 210, W, 50);
    ctx.fillStyle = "#ffe"; ctx.fillRect(190, 20, 20, 6);
    ctx.fillStyle = "#3d2a16"; ctx.fillRect(4, 80, 30, 130); ctx.fillRect(366, 80, 30, 130);
  }
}

// ----- CÁMARA DE CADA PUERTA -----
function fondoPuertaCam(s) {
  ctx.fillStyle = "#15131a"; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#2a2630"; ctx.fillRect(0, 0, 110, H); ctx.fillRect(290, 0, 110, H);
  ctx.fillStyle = "#2c2c30"; ctx.fillRect(0, 210, W, 50);
  ctx.fillStyle = "#ffe"; ctx.fillRect(180, 20, 40, 6);
  ctx.fillStyle = "#2a1f14"; ctx.fillRect(120, 40, 160, 176);
  if (S.puerta[s]) {
    ctx.fillStyle = "#5a3d22"; ctx.fillRect(128, 46, 144, 170);
    ctx.strokeStyle = "#3d2a16"; ctx.lineWidth = 1;
    for (let g = 0; g < 6; g++) { ctx.beginPath(); ctx.moveTo(136 + g * 22, 46); ctx.lineTo(136 + g * 22, 216); ctx.stroke(); }
    ctx.fillStyle = "#c9a040";
    ctx.beginPath(); ctx.arc(s === "L" ? 252 : 148, 130, 4, 0, Math.PI * 2); ctx.fill();
  } else {
    ctx.fillStyle = "#000"; ctx.fillRect(128, 46, 144, 170);
    ctx.fillStyle = "rgba(255,255,220,0.05)"; ctx.fillRect(128, 46, 144, 170);
  }
}

function efectoCamara() {
  ctx.fillStyle = "rgba(0,0,0,0.25)";
  for (let y = 0; y < H; y += 3) ctx.fillRect(0, y, W, 1);
  for (let n = 0; n < 60; n++) { ctx.fillStyle = "rgba(255,255,255,0.05)"; ctx.fillRect(Math.random() * W, Math.random() * H, 2, 2); }
}

function dibujaCamara(i) {
  if (i < 4) {
    fondoCuarto(i);
    let k = 0;
    P.forEach((p, idx) => {
      if (p.pos === i) { dibujaPersonaje(p, idx, 90 + k * 100, SUELO, 140); k++; }
    });
  } else {
    const s = i === 4 ? "L" : "R";
    fondoPuertaCam(s);
    P.forEach((p, idx) => {
      if (p.pos === 4 && p.lado === s && !S.puerta[s]) dibujaPersonaje(p, idx, 200, SUELO, 150);
    });
  }
  efectoCamara();
  ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.fillRect(6, 6, 240, 24);
  ctx.fillStyle = "#fff"; ctx.font = "13px monospace"; ctx.textAlign = "left";
  ctx.fillText("CAM " + (i + 1) + " · " + NOMBRES[i].toUpperCase(), 12, 23);
  ctx.fillStyle = "#f33"; ctx.beginPath(); ctx.arc(W - 16, 18, 5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#fff"; ctx.textAlign = "right"; ctx.fillText("REC", W - 26, 23);
}

// ----- OFICINA -----
function dibujaPuerta(s, x) {
  ctx.fillStyle = "#0a0f22"; ctx.fillRect(x + 10, 12, 40, 22);
  ctx.strokeStyle = "#444"; ctx.lineWidth = 2; ctx.strokeRect(x + 10, 12, 40, 22);
  ctx.fillStyle = "#2a1f14"; ctx.fillRect(x, 40, 60, 176);
  ctx.fillStyle = "#000"; ctx.fillRect(x + 6, 46, 48, 170);
  if (S.puerta[s]) {
    ctx.fillStyle = "#5a3d22"; ctx.fillRect(x + 6, 46, 48, 170);
    ctx.strokeStyle = "#3d2a16"; ctx.lineWidth = 1;
    for (let g = 0; g < 4; g++) { ctx.beginPath(); ctx.moveTo(x + 14 + g * 11, 46); ctx.lineTo(x + 14 + g * 11, 216); ctx.stroke(); }
    ctx.strokeStyle = "#2a1c0e"; ctx.lineWidth = 2;
    ctx.strokeRect(x + 12, 56, 36, 60);
    ctx.strokeRect(x + 12, 128, 36, 80);
    ctx.fillStyle = "#c9a040";
    ctx.beginPath(); ctx.arc(s === "L" ? x + 44 : x + 16, 125, 4, 0, Math.PI * 2); ctx.fill();
  }
  if (S.luz[s]) { ctx.fillStyle = "rgba(255,255,200,0.12)"; ctx.fillRect(x, 40, 60, 176); }
  if (!S.puerta[s]) P.forEach((p, idx) => {
    if (p.pos === 4 && p.lado === s) {
      ctx.globalAlpha = S.luz[s] ? 1 : 0.25;
      dibujaPersonaje(p, idx, x + 30, SUELO, 150);
      ctx.globalAlpha = 1;
    }
  });
  ctx.fillStyle = "#aaa"; ctx.font = "11px sans-serif"; ctx.textAlign = "center";
  ctx.fillText(s === "L" ? "IZQ" : "DER", x + 30, 250);
}

function dibujaOficina() {
  ctx.fillStyle = "#1c1915"; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#2b241b"; ctx.fillRect(0, 206, W, 54);
  ctx.fillStyle = "#060a1e"; ctx.fillRect(150, 30, 100, 70);
  ctx.fillStyle = "#eee"; ctx.beginPath(); ctx.arc(232, 48, 7, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#555"; ctx.lineWidth = 4; ctx.strokeRect(150, 30, 100, 70);
  ctx.beginPath(); ctx.moveTo(200, 30); ctx.lineTo(200, 100); ctx.moveTo(150, 65); ctx.lineTo(250, 65); ctx.stroke();
  ctx.fillStyle = "#4a3520"; ctx.fillRect(110, 170, 180, 14);
  ctx.fillRect(122, 184, 8, 30); ctx.fillRect(270, 184, 8, 30);
  ctx.fillStyle = "#222"; ctx.fillRect(185, 140, 30, 30);
  ctx.fillStyle = S.cam ? "#7cf" : "#111"; ctx.fillRect(189, 144, 22, 20);
  dibujaPuerta("L", 0);
  dibujaPuerta("R", W - 60);
  if (S.energia <= 0) {
    ctx.fillStyle = "#f55"; ctx.font = "bold 18px sans-serif"; ctx.textAlign = "center";
    ctx.fillText("SIN ENERGÍA", W / 2, 120);
  }
}

// ----- MAPA DE CÁMARAS -----
const CW = 400 / (NUM_CAMS + 1);
function dibujaMapa() {
  mctx.clearRect(0, 0, 400, 60);
  for (let i = 0; i <= NUM_CAMS; i++) {
    const x = i * CW, activo = (i < NUM_CAMS && S.cam && S.camN === i) || (i === NUM_CAMS && !S.cam);
    mctx.fillStyle = activo ? "#3a6" : "#222";
    mctx.fillRect(x + 2, 3, CW - 4, 54);
    mctx.fillStyle = "#fff"; mctx.textAlign = "center";
    mctx.font = "bold 10px sans-serif";
    mctx.fillText(i < NUM_CAMS ? "CAM " + (i + 1) : "Oficina", x + CW / 2, 20);
    mctx.font = "10px sans-serif";
    mctx.fillText(i < NUM_CAMS ? CORTOS[i] : "", x + CW / 2, 36);
  }
}

function render() {
  if (S.fin) {
    ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    if (S.fin.gana) {
      ctx.fillStyle = "#6f6"; ctx.font = "bold 22px sans-serif";
      ctx.fillText("¡Noche " + S.noche + " sobrevivida!", W / 2, H / 2);
    } else {
      dibujaPersonaje(S.fin.p, 0, W / 2, H - 5, 240);
      ctx.fillStyle = "#f55"; ctx.font = "bold 20px sans-serif";
      ctx.fillText("¡Te atraparon!", W / 2, 30);
    }
    return;
  }
  if (S.cam) dibujaCamara(S.camN); else dibujaOficina();
  dibujaMapa();
  $("noche").textContent = "Noche " + S.noche;
  $("hora").textContent = HORAS[S.hora];
  $("energia").textContent = "Energía: " + Math.round(S.energia) + "%";
  $("bCam").className = S.cam ? "on" : "";
  $("bLL").className = S.luz.L ? "on" : "";
  $("bLR").className = S.luz.R ? "on" : "";
}

function terminar(fin) {
  S.fin = fin;
  clearInterval(T1);
  const sig = $("sig");
  if (fin.gana) {
    if (S.noche < CFG.noches) {
      sig.textContent = "Siguiente noche";
      sig.style.display = "";
    } else {
      $("final").textContent = TEXTO_FINAL;
    }
  } else {
    sig.textContent = "Reintentar noche";
    sig.style.display = "";
  }
}

function paso() {
  if (S.fin) return;
  S.t++;
  if (S.t % CFG.horaSegundos === 0) S.hora++;
  if (S.hora >= 6) { terminar({ gana: true }); return; }

  const gasto = 0.15 + (S.puerta.L ? 0.4 : 0) + (S.puerta.R ? 0.4 : 0)
              + (S.luz.L ? 0.2 : 0) + (S.luz.R ? 0.2 : 0) + (S.cam ? 0.2 : 0);
  S.energia = Math.max(0, S.energia - gasto);
  if (S.energia <= 0) {
    S.puerta.L = S.puerta.R = false;
    S.luz.L = S.luz.R = false;
    S.cam = false;
  }

  const f = factorNoche();
  for (const p of P) {
    if (S.fin) break;
    if (p.pos < 4) {
      if (Math.random() * 20 < p.ai * f) {
        p.pos++;
        if (p.pos === 4) { p.lado = Math.random() < 0.5 ? "L" : "R"; p.espera = 0; }
      }
    } else if (p.pos === 4) {
      if (S.puerta[p.lado]) {
        // Puerta cerrada: el amigo se regresa y vuelve a recorrer las cámaras
        p.pos = 0;
        p.espera = 0;
        $("msg").textContent = "Una puerta lo detuvo. Vuelve a recorrer el edificio.";
      } else {
        p.espera++;
        if (p.espera >= CFG.esperaPuerta) terminar({ gana: false, p });
      }
    }
  }
}

function reiniciar() {
  S.t = 0; S.hora = 0; S.energia = 100;
  S.puerta = { L: false, R: false }; S.luz = { L: false, R: false };
  S.cam = false; S.camN = 0; S.fin = null;
  crearPersonajes();
  $("msg").textContent = "";
  $("final").textContent = "";
  $("sig").style.display = "none";
  clearInterval(T1);
  T1 = setInterval(paso, 1000);
}

// ----- CONTROLES -----
cv.onclick = e => {
  if (S.fin) return;
  const [x, y] = posicion(e, cv, W, H);
  if (S.cam) { S.camN = (S.camN + 1) % NUM_CAMS; return; }
  if (x < 60 && y >= 40 && y <= 216) {
    if (S.energia > 0) S.puerta.L = !S.puerta.L; else $("msg").textContent = "Sin energía: no puedes cerrar puertas.";
  } else if (x > W - 60 && y >= 40 && y <= 216) {
    if (S.energia > 0) S.puerta.R = !S.puerta.R; else $("msg").textContent = "Sin energía: no puedes cerrar puertas.";
  } else if (x >= 185 && x <= 215 && y >= 140 && y <= 170) {
    if (S.energia > 0) S.cam = true; else $("msg").textContent = "Sin energía: no hay cámaras.";
  }
};

mc.onclick = e => {
  if (S.fin) return;
  const [x] = posicion(e, mc, 400, 60);
  const i = Math.floor(x / CW);
  if (i < NUM_CAMS) {
    if (S.energia > 0) { S.cam = true; S.camN = i; }
    else $("msg").textContent = "Sin energía: no hay cámaras.";
  } else {
    S.cam = false;
  }
};

$("bCam").onclick = () => { if (S.energia > 0 || S.cam) S.cam = !S.cam; };
$("bLL").onclick = () => { if (S.energia > 0) S.luz.L = !S.luz.L; };
$("bLR").onclick = () => { if (S.energia > 0) S.luz.R = !S.luz.R; };
$("sig").onclick = () => {
  if (S.fin && S.fin.gana) S.noche++;
  reiniciar();
};

crearPersonajes();
T1 = setInterval(paso, 1000);
const T2 = setInterval(render, 100);
</script>
